<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which childhood is yours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap">
<style>
  :root { --paper:#EEF1F4; --ink:#141A21; --mute:#5C6773; --line:#C9D1DA; --pick:#1D3B8B; --pickink:#F6F8FB; }
  * { box-sizing:border-box }
  html,body { margin:0; background:var(--paper); color:var(--ink); font-family:Manrope,"Helvetica Neue",Arial,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 24px 96px; }
  h1 { font-size:clamp(28px,6vw,40px); line-height:1.1; font-weight:700; letter-spacing:-0.02em; margin:0 0 8px; }
  .q { color:var(--mute); font-size:17px; margin:0 0 32px; }
  .opts { display:grid; gap:12px; }
  button.opt { text-align:left; background:transparent; border:1px solid var(--line); border-radius:4px; padding:18px 20px; font:inherit; font-size:17px; line-height:1.4; color:var(--ink); cursor:pointer; }
  button.opt strong { display:block; font-weight:700; margin-bottom:4px; }
  button.opt:hover, button.opt:focus-visible { border-color:var(--pick); outline:none; }
  button.opt.none { color:var(--mute); }
  .step { font-size:14px; color:var(--mute); margin-bottom:40px; }
  .result h1 { margin-bottom:24px }
  .frag { font-size:19px; line-height:1.55; white-space:pre-wrap; border-left:3px solid var(--pick); padding-left:20px; margin:0 0 40px; }
  .lora { margin:0 0 40px; padding:0; list-style:none; }
  .lora li { padding:10px 0; border-bottom:1px solid var(--line); font-size:16px; }
  .cta { background:var(--pick); color:var(--pickink); border:0; border-radius:4px; padding:16px 22px; font:inherit; font-size:17px; font-weight:700; cursor:pointer; }
  input { font:inherit; font-size:17px; padding:14px 16px; border:1px solid var(--line); border-radius:4px; width:100%; background:#fff; margin-bottom:16px; }
  .note { color:var(--mute); font-size:14px; margin-top:40px; line-height:1.5; }
  @media (prefers-reduced-motion:no-preference) { .fade { animation:in .35s ease } @keyframes in { from{opacity:0} to{opacity:1} } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById('app');
let seeds, picks = [], stage = 0, name = '', repertoire = [], alive = [], allRows = [];
// Akinator step: score each candidate option by how evenly it splits the childhoods still alive
function bestSplit(options, key) {
  const pool = alive.length ? alive : repertoire;
  const scored = options.map(o => {
    const yes = pool.filter(c => c.links.includes(o.slug)).length;
    const bal = Math.abs(yes / Math.max(pool.length, 1) - 0.5); // 0 is a perfect halving
    return { o, bal, yes };
  }).filter(x => x.yes > 0 || !pool.length);
  scored.sort((a, b) => a.bal - b.bal);
  return scored.slice(0, 4).map(x => x.o);
}
function narrow(o) { const pool = alive.length ? alive : repertoire; const next = pool.filter(c => c.links.includes(o.slug)); alive = next.length ? next : pool; }
const shuffle = a => [...a].sort(() => Math.random() - .5);
const rounds = () => [ // Jung asks. Change the copy, keep the order.
  { key:'parents', title:'Who first carried the parent archetype for you?', q:'Pick the one that is closest. Not perfect, closest.' },
  { key:'parents', title:'And the other, present or cast into shadow?', q:'Closest again.' },
  { key:'schools', title:'Where the collective first fitted you a persona.', q:'Where you learned your rank.' },
  { key:'events',  title:'Which encounter rearranged the whole of your psyche?', q:'One, if any.' },
  { key:'events',  title:'What else has the unconscious kept for you?', q:'Or none of these.' },
  { key:'events',  title:'Name what you pushed into the shadow.', q:'Or none of these.' },
  { key:'events',  title:'One last image, and the Self may appear.', q:'Or none of these.' },
];
const el = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };

function render() {
  const R = rounds();
  if (stage < R.length) {
    const r = R[stage];
    const used = new Set(picks.map(p => p.slug));
    const cand = seeds[r.key].filter(o => !used.has(o.slug));
    const opts = repertoire.length ? bestSplit(cand, r.key) : shuffle(cand).slice(0, 4);
    app.innerHTML = `<div class="fade"><p class="step">${stage + 1} of ${R.length}${repertoire.length ? ` · ${(alive.length || repertoire.length)} childhoods still possible` : ''}</p><h1>${r.title}</h1><p class="q">${r.q}</p><div class="opts"></div></div>`;
    const box = app.querySelector('.opts');
    for (const o of opts) {
      const b = el(`<button class="opt"><strong>${o.name}</strong>${o.text}</button>`);
      b.onclick = () => { picks.push(o); narrow(o); stage++; render(); };
      box.appendChild(b);
    }
    if (r.key === 'events') { const n = el(`<button class="opt none">None of these</button>`); n.onclick = () => { stage++; render(); }; box.appendChild(n); }
    return;
  }
  if (!name) {
    app.innerHTML = `<div class="fade"><h1>Your first name.</h1><p class="q">It goes at the top of the page you can share.</p><input id="nm" autofocus placeholder="Name"><button class="cta" id="go">Find my childhood</button></div>`;
    app.querySelector('#go').onclick = () => { name = app.querySelector('#nm').value.trim() || 'You'; result('United States'); };
    return;
  }
}

// gbrain search --json shape varies by version: an array of {slug, title, type, chunk_text, score} on 0.59,
// sometimes wrapped ({results}, {hits}, ...), or plain text. Take whatever is there, fall back to raw text.
function hitsOf(m) {
  if (m == null) return [];
  if (typeof m === 'string') { try { return hitsOf(JSON.parse(m)); } catch { return []; } }
  if (Array.isArray(m)) return m;
  if (typeof m !== 'object') return [];
  for (const k of ['results', 'hits', 'data', 'items', 'pages', 'matches']) if (m[k] != null) { const h = hitsOf(m[k]); if (h.length) return h; }
  if (typeof m.raw === 'string') return hitsOf(m.raw);
  return (m.slug || m.chunk_text || m.content || m.text) ? [m] : [];
}
const slugOf = h => (h && typeof h === 'object') ? String(h.slug ?? h.page_slug ?? h.path ?? h.id ?? '').replace(/\.mdx?$/, '').split('/').pop() : '';
const textOf = h => typeof h === 'string' ? h : (h?.chunk_text ?? h?.content ?? h?.text ?? h?.body ?? h?.snippet ?? h?.compiled_truth ?? '');
function pickFragment(m, base) {
  const hits = hitsOf(m);
  const rowOf = h => allRows.find(r => r.slug === slugOf(h));
  const isChildhood = h => h?.type === 'childhood' || slugOf(h).startsWith('childhood-');
  const inBase = h => { const r = rowOf(h); return r ? r.base === base : /Lima/.test(String(h?.title ?? '')) === (base === 'Lima, Peru'); };
  const kids = hits.filter(isChildhood);
  const hit = kids.find(inBase) ?? kids[0] ?? hits[0];
  const text = rowOf(hit)?.body || textOf(hit);
  if (text) return text;
  if (typeof m === 'string') return m;
  return (m?.raw && String(m.raw).trim()) || m?.err || JSON.stringify(m, null, 2);
}

async function result(base) {
  app.innerHTML = `<div class="fade"><h1>Searching ${picks.length} moments.</h1><p class="q">Against every childhood in the brain.</p></div>`;
  const query = picks.map(p => `${p.name}. ${p.text}`).join(' ');
  const [m] = await Promise.all([
    fetch('/match', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ query, base }) })
      .then(r => r.text()).then(t => { try { return JSON.parse(t); } catch { return { raw: t }; } })
      .catch(e => ({ raw: '', err: String(e) })),
    base === 'United States' ? fetch('/person', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ name, picks }) }).catch(() => {}) : Promise.resolve(),
  ]);
  const frag = pickFragment(m, base);
  app.innerHTML = `<div class="fade result">
    <p class="step">${name}, base: ${base}</p>
    <h1>The childhood that recognized you.</h1>
    <p class="frag">${String(frag).replace(/</g,'&lt;')}</p>
    <ul class="lora">${picks.map(p => `<li>${p.name}</li>`).join('')}</ul>
    <button class="cta" id="lima">${base === 'Lima, Peru' ? 'Back to the United States' : 'See who I would be in Lima'}</button>
    <p class="note">This childhood was generated, not retrieved. The moments above are yours, chosen by recognition. Identity here is a shared base plus a few life-changing experiences, the way a LoRA adapts a base model.</p>
  </div>`;
  app.querySelector('#lima').onclick = () => result(base === 'Lima, Peru' ? 'United States' : 'Lima, Peru');
}

Promise.all([fetch('/seeds.json').then(r => r.json()), fetch('/childhoods.json').then(r => r.json()).catch(() => [])])
  .then(([s, c]) => { seeds = s; allRows = Array.isArray(c) ? c : []; repertoire = allRows.filter(x => x.base === 'United States'); render(); });
</script>
</body>
</html>
